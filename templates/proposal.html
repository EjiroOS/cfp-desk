{{define "content"}}
{{with .Data}}
<article class="card">
  <p class="meta"><span class="status {{.Status}}">{{.Status}}</span> · {{.Track}} · {{.CreatedAt}}</p>
  <h1>{{.Title}}</h1>
  <p class="meta">by {{.Speaker}}</p>
  <div class="abstract">{{.AbstractHTML}}</div>
</article>
<p><a href="/proposals">Back to my proposals</a></p>
{{end}}
{{end}}
