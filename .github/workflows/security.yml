name: Security checks

on:
  push:
  pull_request:

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Code scan (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/golang --error

  deps:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest
      - run: osv-scanner scan source -r .

  image:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cfp-desk:ci .
      - run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image
          --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed
          cfp-desk:ci

  dast:
    name: Web scan (ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cfp-desk:ci .
      - run: docker run -d -p 8080:8080 cfp-desk:ci
      - run: sleep 5
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          allow_issue_writing: false
	  rules_file_name: .zap/rules.tsv
          fail_action: true